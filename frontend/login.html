<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tawazon — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: radial-gradient(1000px circle at 50% 0%, #e0f2fe 0%, #f8fafc 55%, #f1f5f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.1), 0 0 1px 1px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.9);
      transition: all 0.3s ease;
      position: relative;
    }

    .auth-card:hover {
      box-shadow: 0 28px 56px -12px rgba(15, 23, 42, 0.14), 0 0 1px 1px rgba(15, 23, 42, 0.05);
      border-color: rgba(203, 213, 225, 0.95);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .auth-brand-badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .auth-brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(34, 197, 94, 0.35)) drop-shadow(0 4px 12px rgba(14, 165, 233, 0.3));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-brand-badge:hover img {
      transform: scale(1.08) rotate(4deg);
    }

    .auth-brand-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      direction: ltr !important;
      line-height: 1.1;
    }

    .auth-brand-title .brand-tawa {
      color: #16a34a !important;
      font-weight: 900;
    }

    .auth-brand-title .brand-zon {
      color: #0284c7 !important;
      font-weight: 900;
    }

    .auth-brand-sub {
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .auth-group {
      margin-bottom: 1.35rem;
    }

    .auth-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.45rem;
    }

    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-group input {
      width: 100%;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .auth-group input:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12);
    }

    .btn-auth {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 6px 20px -4px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-auth:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1.5px);
      box-shadow: 0 10px 24px -4px rgba(37, 99, 235, 0.5);
    }

    .btn-auth:active {
      transform: translateY(0);
    }

    .spinner-auth {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    /* Demo Quick Credentials Card for Defense / Presentation */
    .demo-credentials {
      margin-top: 1.75rem;
      padding: 0.9rem 1rem;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .demo-credentials-title {
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .demo-pill {
      display: inline-block;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      color: #2563eb;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-pill:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-start">
    <a href="login.html" class="nav-brand"><img src="assets/logo.png" alt="Tawazon Logo" class="brand-logo-img" /><span class="brand-name"><span class="brand-tawa">Tawa</span><span class="brand-zon">zon</span></span></a>
  </div>
  <div class="nav-end">
    <button class="lang-btn" onclick="i18n.toggle()"><span class="nav-btn-icon">🌐</span> <span>العربية</span></button>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-badge">
        <img src="assets/logo.png" alt="Tawazon Logo" />
      </div>
      <h1 class="auth-brand-title"><span class="brand-name"><span class="brand-tawa">Tawa</span><span class="brand-zon">zon</span></span></h1>
      <p class="auth-brand-sub" data-i18n="auth_portal_title">Sign in to Enterprise Health Intelligence</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="auth-group">
        <label for="loginUsername" data-i18n="auth_username">Username</label>
        <div class="auth-input-wrap">
          <input type="text" id="loginUsername" placeholder="e.g. admin or emp0307" autocomplete="username" required />
        </div>
      </div>
      <div class="auth-group">
        <label for="loginPassword" data-i18n="auth_password">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" class="btn-auth" id="btnLogin">
        <span id="btnLoginText" data-i18n="auth_btn_login">Sign In</span>
        <div class="spinner-auth" id="loginSpinner"></div>
      </button>
    </form>

    <!-- Quick Defense Access Badge -->
    <div class="demo-credentials">
      <div class="demo-credentials-title">
        <span>⚡</span> <span data-i18n="auth_demo_title">Quick Demo Login:</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-top:0.4rem;">
        <span>👑 Admin: <span class="demo-pill" onclick="fillCreds('admin', '04072005')">admin</span></span>
        <span>👤 Employee: <span class="demo-pill" onclick="fillCreds('emp0307', '123456')">emp0307</span></span>
      </div>
    </div>

    <div class="alert alert-error" id="authError" style="margin-top:1.25rem;"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
  function showError(msg) {
    const el = document.getElementById("authError");
    el.textContent = msg;
    el.classList.add("show");
  }

  function fillCreds(u, p) {
    document.getElementById("loginUsername").value = u;
    document.getElementById("loginPassword").value = p;
  }

  // Handle Login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("authError").classList.remove("show");

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    const btn = document.getElementById("btnLogin");
    const spn = document.getElementById("loginSpinner");
    const btnText = document.getElementById("btnLoginText");

    btn.disabled = true;
    spn.style.display = "block";

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || (i18n.lang() === "ar" ? "فشل تسجيل الدخول: اسم المستخدم أو كلمة المرور غير صحيحة" : "Login failed: Invalid username or password"));
      }

      const user = await res.json();
      AUTH.setUser(user);

      // Redirect based on role
      if (user.role === "admin") {
        window.location.href = "index.html";
      } else {
        window.location.href = "employee-portal.html";
      }
    } catch (err) {
      if (err.message === "Failed to fetch" || err.name === "TypeError") {
        const isAr = typeof i18n !== "undefined" && i18n.lang() === "ar";
        showError(isAr 
          ? "⚠️ تعذر الاتصال بالخادم. يرجى التأكد من تشغيل السيرفر (اضغط F5 في VS Code أو شغل run.bat)." 
          : "⚠️ Backend server unreachable. Please start the server (press F5 in VS Code or run run.bat).");
      } else {
        showError(err.message);
      }
    } finally {
      btn.disabled = false;
      spn.style.display = "none";
    }
  });
</script>

</body>
</html>
